name: Bug or misdiagnosis
description: SAdns crashed, misbehaved, or got a diagnosis wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SAdns version (`sadns version`) and OS
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Router / resolver (UniFi, Pi-hole, OpenWrt, ISP box…)
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Attach the JSON report generated with the **Public-safe** privacy level (`sadns run --privacy public`). Please check it before posting.
