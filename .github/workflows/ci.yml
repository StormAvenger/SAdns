name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux + Windows runners only (macOS is cross-compiled) to keep Actions usage minimal.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no third-party modules, nothing to cache
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile all release targets
        if: runner.os == 'Linux'
        run: make dist
