name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # newest Go: current macOS linker requirements, latest security fixes
          cache: false # no third-party modules, nothing to cache
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Coverage by package
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=cover.out ./... > /dev/null
          go tool cover -func=cover.out | tail -1
          go test -cover ./... | sed 's/^/  /'
      - name: Cross-compile all release targets
        if: runner.os == 'Linux'
        run: make dist

  min-go:
    # Building from source must keep working with the minimum in go.mod.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./... && go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # newest Go: current macOS linker requirements, latest security fixes
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
